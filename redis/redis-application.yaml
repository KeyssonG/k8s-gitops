apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis
  namespace: argocd
  labels:
    app.kubernetes.io/name: redis
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: producao
  source:
    repoURL: https://github.com/KeyssonG/Redis.git
    path: k8s
    targetRevision: HEAD
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
